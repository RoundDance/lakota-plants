[build]
  command = "npm run build"
  publish = "dist"
  # Decides whether this push is worth its 15 credits. Content edits wait for
  # a publish; code changes deploy on push. The script explains the rest.
  ignore = "bash scripts/should-build.sh"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
