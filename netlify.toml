[build]
  command = "npm run build"
  publish = "dist"
  # Skip a deploy (and its credits) when only docs changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!docs' ':!README.md'"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
